image: docker:26.1.3
stages:
  - build
  - migrate
  - deploy

services:
  - docker:26.1.3-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - docker login $CI_REGISTRY --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD
  - apk --no-cache --update add wget bash build-base curl openssh-client sshpass

build_image:
  stage: build
  script:
    - make build-image TAG=$CI_PIPELINE_IID PROJECT_NAME=$CI_PROJECT_NAMESPACE
    - make push-image TAG=$CI_PIPELINE_IID PROJECT_NAME=$CI_PROJECT_NAMESPACE
  only:
    - master
.deploy_image:     
    image: registry.gitlab.com/tasnim3050333/tasnim_next_frontend:update-service-awx-ee-1.0.0
    stage: deploy
    before_script:  
    - eval $(ssh-agent -s)
    - echo "$SERVER_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -t rsa gitlab.com >> ~/.ssh/known_hosts
    - chmod 700 ~/.ssh
    - mkdir ~/ansible && cd ~/ansible
    - git clone git@gitlab.com:azizkarimovv/update-service.git && cd update-service
    script:
    - ansible-playbook playbooks/ubuntu/update.yml -e "docker_user=$DOCKER_USER docker_password=$DOCKER_PASSWORD registry=$CI_REGISTRY group=$(echo $CI_PROJECT_NAMESPACE | tr '[:upper:]' '[:lower:]') service_name=$(echo $CI_PROJECT_NAME | tr '[:upper:]' '[:lower:]') unit_name=$UNIT image_tag=$CI_PIPELINE_IID ansible_host=$HOST ansible_user=$USER ansible_port=$PORT"

deploy_image_prod:
    extends: .deploy_image
    only:
        - master
    variables:
        PRIVATE_KEY: $SERVER_PRIVATE_KEY
        HOST: $SERVERCORE_HOST
        USER: $SERVERCORE_USER
        PORT: $SERVERCORE_PORT
        UNIT: tasnim_next_frontend.service
